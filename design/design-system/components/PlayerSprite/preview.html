<!-- @dsCard group="Sprites" height=250 width=880 subtitle="22 frames, 12 colours, at the game's own timing" -->
<style>
  body { margin: 0; background: var(--ui-panel); color: var(--ui-text); font-family: var(--font-pixel); }
  .wrap { display: grid; gap: 20px; padding: 16px; }
  .anims { display: flex; gap: 24px; flex-wrap: wrap; }
  figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
  canvas { width: 96px; height: 96px; image-rendering: pixelated; background: var(--ui-module); box-shadow: 0 0 0 1px var(--ui-frame); }
  figcaption { font-size: 14px; line-height: 16px; }
  .note { font-size: 7px; line-height: 8px; color: var(--ui-icon); }
  .pal { display: flex; flex-wrap: wrap; gap: 6px; }
  .sw { width: 28px; height: 28px; box-shadow: 0 0 0 1px var(--ui-frame); }
</style>
<div class="wrap">
  <div class="anims" id="anims"></div>
  <div class="pal" id="pal" aria-label="The player's twelve colours"></div>
  <div class="note">HOLDS IN STEPS, 60 A SECOND · SHOWN 4X</div>
</div>
<script>
  // From src/data/sprite-art.json: frame numbers and how many steps each is held.
  // @generated by tools/design-system.mjs from the game's code; do not edit by hand
  const CLIPS = [
    ['IDLE', [0, 1, 2, 3, 4, 5], [40, 6, 40, 6, 30, 5]],
    ['RUN', [6, 7, 8, 9, 10, 11, 12, 13], [4, 4, 3, 4, 4, 4, 3, 4]],
    ['JUMP', [14, 15, 16], [20, 20, 20]],
    ['SLIDE', [17, 18, 19, 20, 21], [4, 4, 4, 9, 5]],
  ];
  // @generated end
  const PAL = ['outline', 'player-white', 'player-light', 'player-mid', 'player-shadow', 'player-deep',
    'player-joint', 'player-jointdark', 'player-accentlight', 'player-accent', 'player-accentshade', 'player-accentdim'];
  const pal = document.getElementById('pal');
  for (const t of PAL) { const d = document.createElement('div'); d.className = 'sw'; d.title = t; d.style.background = `var(--${t})`; pal.append(d); }

  const img = new Image();
  img.src = '/_blob/ec46c1ec5c6d7cbf40539b5f23676fb2';
  const views = CLIPS.map(([name]) => {
    const f = document.createElement('figure'), c = document.createElement('canvas'), cap = document.createElement('figcaption');
    c.width = c.height = 24; cap.textContent = name; f.append(c, cap);
    document.getElementById('anims').append(f);
    const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
    return ctx;
  });
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frameAt(frames, holds, step) {
    const total = holds.reduce((a, b) => a + b, 0);
    let t = step % total;
    for (let i = 0; i < frames.length; i++) { if (t < holds[i]) return frames[i]; t -= holds[i]; }
    return frames[0];
  }
  function draw(step) {
    CLIPS.forEach(([, frames, holds], i) => {
      const n = still ? frames[0] : frameAt(frames, holds, step);
      views[i].clearRect(0, 0, 24, 24);
      views[i].drawImage(img, n * 24, 0, 24, 24, 0, 0, 24, 24);
    });
  }
  img.onload = () => {
    if (still) return draw(0);
    const t0 = performance.now();
    const loop = (now) => { draw(Math.floor((now - t0) / (1000 / 60))); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  };
</script>
