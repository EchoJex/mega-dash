<!-- @dsCard group="Sprites" height=190 width=880 subtitle="Same art, same box: only the outline turns gold" -->
<style>
  body { margin: 0; background: var(--ui-panel); color: var(--ui-text); font-family: var(--font-pixel); }
  .wrap { display: flex; gap: 40px; padding: 16px; align-items: flex-end; flex-wrap: wrap; }
  figure { margin: 0; display: grid; gap: 8px; }
  canvas { width: 320px; height: 80px; image-rendering: pixelated; }
  figcaption { font-size: 14px; line-height: 16px; }
  .note { font-size: 7px; line-height: 8px; color: var(--ui-icon); }
</style>
<div class="wrap">
  <figure><canvas id="base" width="64" height="16"></canvas><figcaption>SPIGLET</figcaption></figure>
  <figure><canvas id="elite" width="64" height="16"></canvas><figcaption>ELITE SPIGLET</figcaption></figure>
  <div class="note">THE GAME'S OWN SHEET, 4 FRAMES, SHOWN 5X</div>
</div>
<script>
  // The elite is the base minion with every outline pixel on the silhouette's
  // outer edge in elite-outline. Nothing else changes: the box, the frames and
  // the inner dark pixels (eyes, joints) stay as drawn.
  const css = getComputedStyle(document.documentElement);
  const tok = (n) => css.getPropertyValue('--' + n).trim();
  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const img = new Image();
  img.onload = () => {
    for (const id of ['base', 'elite']) {
      const g = document.getElementById(id).getContext('2d');
      g.drawImage(img, 0, 0);
      if (id === 'base') continue;
      const d = g.getImageData(0, 0, 64, 16), p = d.data;
      const [or, og, ob] = rgb(tok('outline')), [er, eg, eb] = rgb(tok('elite-outline'));
      const clear = (x, y) => x < 0 || y < 0 || x >= 64 || y >= 16 || p[(y * 64 + x) * 4 + 3] === 0;
      const edge = [];
      for (let y = 0; y < 16; y++) for (let x = 0; x < 64; x++) {
        const i = (y * 64 + x) * 4;
        if (p[i + 3] && p[i] === or && p[i + 1] === og && p[i + 2] === ob
          && (clear(x - 1, y) || clear(x + 1, y) || clear(x, y - 1) || clear(x, y + 1))) edge.push(i);
      }
      for (const i of edge) { p[i] = er; p[i + 1] = eg; p[i + 2] = eb; }
      g.putImageData(d, 0, 0);
    }
  };
  img.src = '/_blob/fc27925c8bd2c983bf1c21bd20dd5291';
</script>
