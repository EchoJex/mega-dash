<!-- @dsCard group="Sprites" height=320 width=880 subtitle="All seventeen as the game draws them today, beside the player, 2x" -->
<style>
  body { margin: 0; background: var(--ui-panel); color: var(--ui-text); font-family: var(--font-pixel); }
  .wrap { display: grid; gap: 18px; padding: 16px; }
  .row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  figure { margin: 0; display: grid; gap: 6px; justify-items: center; }
  canvas { image-rendering: pixelated; }
  figcaption { font-size: 7px; line-height: 8px; }
</style>
<div class="wrap"><div class="row" id="a"></div><div class="row" id="b"></div></div>
<script>
  // Footprints through the game's own arithmetic (design/sprite-targets.json):
  // height = round(24 x scale), width = round(height x wide), wide 0.75 unless he sets his own.
  // @generated by tools/design-system.mjs from the game's code; do not edit by hand
  const BOSSES = [
    ['proto', 'PROTO', 14, 19], ['blaze', 'BLAZE', 32, 42], ['tempest', 'TEMPEST', 27, 36], ['volt', 'VOLT', 30, 40],
    ['thorn', 'THORN', 32, 43], ['frost', 'FROST', 33, 44], ['strike', 'STRIKE', 38, 44], ['venom', 'VENOM', 31, 41],
    ['quake', 'QUAKE', 35, 47], ['gale', 'GALE', 27, 36], ['psi', 'PSI', 28, 37], ['swarm', 'SWARM', 29, 38],
    ['granite', 'GRANITE', 36, 48], ['wraith', 'WRAITH', 29, 38], ['drake', 'DRAKE', 35, 46], ['eclipse', 'ECLIPSE', 32, 42],
    ['alloy', 'ALLOY', 35, 46]];
  // @generated end
  const css = getComputedStyle(document.documentElement);
  const tok = (n) => css.getPropertyValue('--' + n).trim();
  const S = 2;
  function card(parent, label, w, h, paint) {
    const f = document.createElement('figure'), c = document.createElement('canvas'), cap = document.createElement('figcaption');
    c.width = w; c.height = h; c.style.width = w * S + 'px'; c.style.height = h * S + 'px';
    cap.textContent = label; f.append(c, cap); parent.append(f);
    const g = c.getContext('2d'); g.imageSmoothingEnabled = false; paint(g);
  }
  // The player first, for scale: his idle frame from the sheet, drawn once it loads.
  const img = new Image();
  card(document.getElementById('a'), 'PLAYER', 24, 24, (g) => { img.onload = () => g.drawImage(img, 0, 0, 24, 24, 0, 0, 24, 24); });
  img.src = '/_blob/ec46c1ec5c6d7cbf40539b5f23676fb2';
  BOSSES.forEach(([id, label, w, h], i) => {
    card(document.getElementById(i < 8 ? 'a' : 'b'), label, w, h, (g) => {
      // The game's placeholder: primary body, a secondary band over the top 28%,
      // and the near-black outline as the outermost pixel.
      g.fillStyle = tok(`boss-${id}-primary`); g.fillRect(0, 0, w, h);
      g.fillStyle = tok(`boss-${id}-secondary`); g.fillRect(0, 0, w, Math.max(2, Math.round(h * 0.28)));
      g.strokeStyle = tok('outline'); g.lineWidth = 1; g.strokeRect(0.5, 0.5, w - 1, h - 1);
    });
  });
</script>
