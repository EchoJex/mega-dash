<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Idle whip editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit}
</style>
</helmet>
<div style="width: 1100px; height: 1000px; box-sizing: border-box; padding: 32px 38px; display: flex; flex-direction: column; gap: 16px; background: #0A0A12; color: #E8ECF4; font-family: system-ui, sans-serif" onPointerUp="{{stop}}" onPointerLeave="{{stop}}">
<h1 style="margin: 0; font-size: 28px; letter-spacing: 1px; color: #FFFFFF">THE IDLE WHIP · EDIT IT PIXEL BY PIXEL</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #C3CAD7; max-width: 1000px">Pick a colour, then tap or drag on the grid. The faint figure is his standing picture, for placement only; it is not part of the whip. The yellow square is his hand, the point the game holds the whip by. Your drawing is {{saveNote}}</p>
<div style="display: flex; gap: 24px; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: grid; grid-template-columns: repeat(40, 14px); grid-auto-rows: 14px; gap: 0; touch-action: none; cursor: crosshair; background: #3C4054; outline: 1px solid #565E78" onPointerDown="{{down}}" onPointerMove="{{move}}">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="1040"><div style="{{c.style}}"></div></sc-for>
</div>
<div style="display: flex; gap: 10px; align-items: center">
<button type="button" onClick="{{toggleUnder}}" style="padding: 10px 14px; min-height: 44px; background: #23283A; color: #E8ECF4; border: 1px solid #565E78; border-radius: 4px; cursor: pointer">{{underLabel}}</button>
<button type="button" onClick="{{undo}}" style="padding: 10px 14px; min-height: 44px; background: #23283A; color: #E8ECF4; border: 1px solid #565E78; border-radius: 4px; cursor: pointer">Undo</button>
<button type="button" onClick="{{reset}}" style="padding: 10px 14px; min-height: 44px; background: #23283A; color: #E8ECF4; border: 1px solid #565E78; border-radius: 4px; cursor: pointer">Back to Claude's drawing</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; width: 330px">
<div style="font-size: 13px; letter-spacing: 1px; color: #8990A9">COLOURS</div>
<sc-for list="{{pal}}" as="p"><button type="button" onClick="{{p.pick}}" style="{{p.style}}"><span style="{{p.swatch}}"></span><span>{{p.name}}</span></button></sc-for>
<div style="font-size: 13px; letter-spacing: 1px; color: #8990A9; margin-top: 8px">TRUE SIZE ×2</div>
<div style="display: grid; grid-template-columns: repeat(40, 2px); grid-auto-rows: 2px; width: 80px; background: #3C4054; padding: 6px">
<sc-for list="{{tiny}}" as="t"><div style="{{t}}"></div></sc-for>
</div>
</div>
</div>
<label for="whip-rows" style="font-size: 13px; letter-spacing: 1px; color: #8990A9">YOUR DRAWING AS TEXT · copy it and paste it to Claude when you're done</label>
<div style="display: flex; gap: 10px; align-items: flex-start">
<textarea id="whip-rows" readonly="" value="{{text}}" style="width: 600px; height: 200px; background: #10131C; color: #C3CAD7; border: 1px solid #363D52; font: 12px/14px monospace; padding: 8px; resize: none"></textarea>
<button type="button" onClick="{{copy}}" style="padding: 10px 14px; min-height: 44px; background: #3CBCFC; color: #0A0A12; border: 0; border-radius: 4px; font-weight: 600; cursor: pointer">{{copyLabel}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":1000}}'>
var DATA = {"crop": ["........................................", "........................................", "........................................", "........................................", "........................................", "........................................", "........................................", "........................................", "........................................", "........................................", "........................................", "........................................", "........................................", "........................................", "............0...........................", ".........00090..........................", "........0444440.........................", ".......020000020........................", ".......020111020........................", ".......020000020........................", "........01111190........................", "........020000070.......................", ".......020....090.......................", ".......0a0.....0........................", "........0...............................", "........................................"], "under": ["........................................", "...........00000000.....................", "........000233111330....................", ".......0899233313330....................", ".......0a9943333333000..................", ".......000023a99988900..................", "..........043a99999a00..................", "..........04222222300...................", "..........0442233330....................", "...........00000000.....................", "...........007667000....................", "........0000233311300000................", "........0540233331333290................", "........0550423333322490................", "........05404233332444a0................", "........0650442222200000................", "........000076666670....................", "..........042202330.....................", "..........042302310.....................", "..........042202330.....................", "..........042202330.....................", "..........0542042330....................", "..........0654054220....................", "..........0000000000....................", "........................................", "........................................"], "pal": [{"k": "0", "hex": "#0A0A12", "name": "outline"}, {"k": "1", "hex": "#136B1A", "name": "vine shade"}, {"k": "2", "hex": "#2AAB1C", "name": "vine"}, {"k": "3", "hex": "#FFFFFF", "name": "glint core"}, {"k": "4", "hex": "#8BE36E", "name": "vine highlight"}, {"k": "5", "hex": "#5C4033", "name": "thorn"}, {"k": "6", "hex": "#9A7652", "name": "thorn highlight"}, {"k": "7", "hex": "#7A563D", "name": "grip"}, {"k": "8", "hex": "#FFF3A6", "name": "glint"}, {"k": "9", "hex": "#3B281E", "name": "grip shade"}, {"k": "a", "hex": "#0E4512", "name": "bud"}, {"k": "b", "hex": "#B8F07A", "name": "glint halo"}], "ppal": {"0": "#0A0A12", "1": "#FFFFFF", "2": "#C3CAD7", "3": "#EDF1F7", "4": "#8990A9", "5": "#565E78", "6": "#363D52", "7": "#23283A", "8": "#B4ECFF", "9": "#3CBCFC", "a": "#1C74C8", "b": "#103C70"}, "x0": 30, "y0": 50};
var W = 40, H = 26, HAND_X = 50 - DATA.x0, HAND_Y = 62 - DATA.y0;
function hexOf(k) { for (var i = 0; i < DATA.pal.length; i++) if (DATA.pal[i].k === k) return DATA.pal[i].hex; return null; }
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { rows: DATA.crop.slice(), color: '2', under: true, saved: 'kept only in this page until you copy it', copied: false };
    this.painting = false; this.history = []; this.db = null;
  }
  componentDidMount() {
    var self = this;
    try {
      if (window.claude && window.claude.use) window.claude.use('db').then(function (db) {
        if (!db) return;
        self.db = db;
        db.doc('whip/rest').get().then(function (s) {
          var d = s.exists ? s.data() : null;
          if (d && Array.isArray(d.rows) && d.rows.length === H) self.setState({ rows: d.rows.slice() });
          self.setState({ saved: 'saved automatically after each stroke, so Claude can read it' });
        }).catch(function () {});
      }).catch(function () {});
    } catch (e) {}
  }
  cellAt(e) {
    var r = e.currentTarget.getBoundingClientRect();
    var x = Math.floor((e.clientX - r.left) / r.width * W), y = Math.floor((e.clientY - r.top) / r.height * H);
    return (x < 0 || y < 0 || x >= W || y >= H) ? null : [x, y];
  }
  paint(e) {
    var c = this.cellAt(e); if (!c) return;
    var rows = this.state.rows, row = rows[c[1]];
    if (row[c[0]] === this.state.color) return;
    var next = rows.slice(); next[c[1]] = row.slice(0, c[0]) + this.state.color + row.slice(c[0] + 1);
    this.setState({ rows: next });
  }
  save() {
    if (!this.db) return;
    var self = this;
    this.db.doc('whip/rest').set({ rows: this.state.rows, at: new Date().toISOString() }).catch(function () { self.setState({ saved: 'not saved (no permission): copy the text instead' }); });
  }
  renderVals() {
    var self = this, st = this.state, cells = [], tiny = [];
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var k = st.rows[y][x], hex = k === '.' ? null : hexOf(k);
      var bg = hex || (st.under && DATA.under[y][x] !== '.' ? DATA.ppal[DATA.under[y][x]] : null);
      var op = hex ? 1 : 0.28;
      var hand = (x === HAND_X && y === HAND_Y) ? 'box-shadow: inset 0 0 0 2px #F5D328;' : '';
      cells.push({ style: 'background:' + (bg || 'transparent') + ';opacity:' + (bg ? op : 1) + ';outline:1px solid rgba(255,255,255,0.05);' + hand });
      tiny.push('background:' + (hex || (st.under && DATA.under[y][x] !== '.' ? DATA.ppal[DATA.under[y][x]] : 'transparent')));
    }
    var pal = [{ k: '.', hex: null, name: 'eraser (see-through)' }].concat(DATA.pal).map(function (p) {
      var on = st.color === p.k;
      return { name: p.name, pick: function () { self.setState({ color: p.k }); },
        style: 'display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;background:' + (on ? '#23283A' : 'transparent') + ';color:#E8ECF4;border:' + (on ? '2px solid #3CBCFC' : '1px solid #363D52') + ';border-radius:4px;cursor:pointer;text-align:left',
        swatch: 'width:24px;height:24px;flex:none;border:1px solid #565E78;background:' + (p.hex || 'repeating-conic-gradient(#565E78 0 25%, #23283A 0 50%) 0 0/8px 8px') };
    });
    return {
      cells: cells, tiny: tiny, pal: pal, saveNote: st.saved,
      text: '# rest, sheet x ' + DATA.x0 + '..' + (DATA.x0 + W - 1) + ', y ' + DATA.y0 + '..' + (DATA.y0 + H - 1) + '\n' + st.rows.join('\n'),
      underLabel: st.under ? 'Hide his body' : 'Show his body',
      copyLabel: st.copied ? 'Copied' : 'Copy text',
      down: function (e) { self.history.push(self.state.rows); self.painting = true; self.paint(e); },
      move: function (e) { if (self.painting) self.paint(e); },
      stop: function () { if (self.painting) { self.painting = false; self.save(); } },
      toggleUnder: function () { self.setState({ under: !st.under }); },
      undo: function () { var h = self.history.pop(); if (h) { self.setState({ rows: h }, function () { self.save(); }); } },
      reset: function () { self.history.push(st.rows); self.setState({ rows: DATA.crop.slice() }, function () { self.save(); }); },
      copy: function () {
        var t = '# rest, sheet x ' + DATA.x0 + '..' + (DATA.x0 + W - 1) + ', y ' + DATA.y0 + '..' + (DATA.y0 + H - 1) + '\n' + st.rows.join('\n');
        try { navigator.clipboard.writeText(t).then(function () { self.setState({ copied: true }); }); } catch (e) {}
      }
    };
  }
}
</script>
</body>
</html>
