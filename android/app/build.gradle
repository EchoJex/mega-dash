apply plugin: 'com.android.application'

android {
    namespace "com.megadash.game"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.megadash.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes -PversionCodeOverride=<n>, monotonically increasing per run.
        // The in-app updater compares that number against the installed build to
        // decide whether there is anything newer, so it must never go backwards.
        versionCode project.hasProperty('versionCodeOverride')
                ? project.versionCodeOverride.toInteger() : 1
        versionName project.hasProperty('versionNameOverride')
                ? project.versionNameOverride : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /**
     * ONE SIGNING IDENTITY FOR EVERY BUILD, FOREVER.
     *
     * Android refuses to install an APK over one signed with a different key, so
     * the in-app updater only works if every CI run signs identically. A locally
     * generated debug key would differ per machine and per runner, and every
     * build would demand an uninstall — losing the save.
     *
     * Both build types point at this same config on purpose: a debug build and a
     * release build of the same commit are interchangeable as far as the
     * installer is concerned, and a branch build can always update a main build.
     *
     * DO NOT change `keyAlias`, and do not regenerate this keystore. The signing
     * IDENTITY is the key inside it, not the filename — swapping either one makes
     * every phone with the game installed require a manual uninstall first. The
     * alias reads as a debug alias for the historical reason that this started as
     * the debug key; renaming it now would cost a forced reinstall for nothing.
     *
     * This protects nothing and is not a secret: it signs an unreleased game that
     * is on no store. A real release key would never live in a repository.
     */
    signingConfigs {
        shared {
            storeFile file('megadash-signing.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            // v2/v3 are whole-APK signatures the platform can verify far more
            // cheaply and strictly than the v1 JAR signature. Sideloaded APKs
            // carrying only a v1 signature look dated to the package verifier,
            // and v1-only installs are rejected outright from Android 11 up.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            // WHAT SHIPS. The build published to GitHub Releases must be a
            // RELEASE build: a debug build carries android:debuggable="true",
            // which lets any process with ADB access inject code into it, and is
            // one of the clearest heuristics behind Play Protect's "Harmful app
            // blocked" on a sideloaded APK. There is nothing to gain from it here
            // — the dev loop is "install the APK and play", not chrome://inspect.
            signingConfig signingConfigs.shared
            // R8 stays OFF deliberately. Obfuscated code in a sideloaded APK
            // reads as MORE suspicious to a scanner, not less, and the bundle is
            // a Phaser game inside a WebView — there is nothing to shrink.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
