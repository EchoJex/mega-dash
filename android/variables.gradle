ext {
    // minSdk 22 covers essentially every device still running. Android 14+ blocks
    // installing apps that TARGET below 23, which is about targetSdk, not this.
    minSdkVersion = 22
    // API 35 (Android 15). Capacitor 6 is validated against 34 and ships nothing
    // that breaks at 35; API 36 needs Capacitor 7, which is a framework major
    // upgrade and a separate job. Requires AGP 8.6+ — see android/build.gradle.
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}