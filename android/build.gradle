// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.7 is the floor for compileSdk 35 (8.6 is the first that accepts
        // it; 8.7 is the first Capacitor itself moved to). It requires Gradle 8.9
        // — see gradle/wrapper/gradle-wrapper.properties — and JDK 17, which is
        // what the CI workflow installs.
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
